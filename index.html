<style>
/* base.css — каркас прототипа A: телефон, экраны, шторки. Значения — из Figma (секция 22962:140258). */
:root {
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, Roboto, "Helvetica Neue", sans-serif;
  --t1: rgb(3 3 6 / .88);          /* text/primary */
  --t2: rgb(4 4 19 / .55);         /* text/secondary */
  --t-inv: rgb(255 255 255 / .94);
  --bg2: #F2F3F5;                  /* серая подложка: плашки, аватары, чипы */
  --ink: #030306;                  /* чёрная кнопка, галочка */
  --icon: #898991;                 /* шевроны, лупа */
  --green: #0CC44D;                /* дуга спидометра */
  --green-t: #0D9336;              /* «Вам 1500 ₽», «до 24 000 ₽» */
  --green-bg: #DFF8E5;
  --grabber: #B8B9C0;
  --shadow-card: 0 4px 40px rgb(0 0 0 / .02), 0 2px 8px rgb(0 0 0 / .04);
  --ease: cubic-bezier(.4, 0, .2, 1);
  --ease-out: cubic-bezier(.2, .8, .2, 1);
  --safe-b: env(safe-area-inset-bottom, 0px);
}
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  font-family: var(--font); font-size: 15px; line-height: 20px; color: var(--t1);
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
  background: #EDEEF0;
  font-variant-numeric: tabular-nums;
}
button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; }
p, h1, h2, h3 { margin: 0; }
img { display: block; }

/* Стенд: на десктопе — телефон 375×812 по центру, на телефоне — во весь экран */
.stage { min-height: 100%; display: grid; place-items: center; padding: 24px; }
.device {
  position: relative; width: 375px; height: 812px; overflow: hidden; overflow: clip; isolation: isolate;
  background: #fff; border-radius: 44px; box-shadow: 0 8px 40px rgb(0 0 0 / .12);
}
@media (max-width: 500px) {
  body { background: #fff; }
  .stage { padding: 0; display: block; }
  .device { width: 100vw; height: 100vh; height: 100dvh; border-radius: 0; box-shadow: none; }
}

/* Статус-бар iOS (44 px, как в «(n)StatusBar» макета). На телефоне — скрыт: у телефона свой */
.sb { height: 44px; flex: none; display: flex; align-items: flex-start; justify-content: space-between; padding: 16px 12px 0 16px; color: var(--t1); pointer-events: none; }
.sb--dark { color: #F2F3F5; }
.sb__time { width: 48px; text-align: center; font-size: 15px; line-height: 13px; font-weight: 600; letter-spacing: -.28px; }
.sb__icons { display: flex; gap: 7px; align-items: center; }
.sb__icons svg { display: block; fill: currentColor; }
@media (max-width: 500px) { .sb { visibility: hidden; height: env(safe-area-inset-top, 0px); padding: 0; } }

/* Экраны и push-переход */
.screens { position: absolute; inset: 0; overflow: hidden; overflow: clip; }
.screen { position: absolute; inset: 0; display: flex; flex-direction: column; background: #fff; overflow: hidden; overflow: clip; visibility: hidden; }
.screen.is-active { visibility: visible; z-index: 2; }
.scroll { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
.scroll::-webkit-scrollbar { display: none; }
.screen.push-in  { visibility: visible; z-index: 3; transform: translateX(100%); }
.screen.push-out { visibility: visible; z-index: 2; }
.screen.pop-in   { visibility: visible; z-index: 2; transform: translateX(-30%); }
.screen.pop-out  { visibility: visible; z-index: 3; }
.screens.is-animating .screen { transition: transform 360ms var(--ease); }
.screen.push-in.go, .screen.pop-in.go { transform: none; }
.screen.push-out.go { transform: translateX(-30%); }
.screen.pop-out.go  { transform: translateX(100%); }

/* Home indicator поверх всего (на десктопе) */
.hi { position: absolute; z-index: 80; left: 50%; bottom: 8px; width: 134px; height: 5px; margin-left: -67px; border-radius: 100px; background: #212124; pointer-events: none; }
@media (max-width: 500px) { .hi { display: none; } }

/* Шторка «SexyOverlay»: фон 65 % чёрного, верх r12, грабер 36×4 #B8B9C0 */
.scrim { position: absolute; inset: 0; z-index: 50; background: rgb(0 0 0 / .65); opacity: 0; pointer-events: none; transition: opacity 300ms ease-out; }
.scrim.is-open { opacity: 1; pointer-events: auto; }
.scrim--light { background: rgb(0 0 0 / .40); }
.sheet {
  position: absolute; z-index: 60; left: 0; right: 0; bottom: 0; max-height: calc(100% - 44px);
  display: flex; flex-direction: column; background: #fff; border-radius: 12px 12px 0 0;
  padding: 4px 0 calc(21px + var(--safe-b)); transform: translateY(100%); visibility: hidden;
  transition: transform 300ms var(--ease-out), visibility 0s linear 300ms;
}
.sheet.is-open { transform: none; visibility: visible; transition: transform 300ms var(--ease-out); }
.sheet__grab { flex: none; height: 20px; margin: -8px 0; position: relative; z-index: 1; display: flex; align-items: center; justify-content: center; touch-action: none; } /* видимые 4 px, зона касания 20 px */
.sheet__head { touch-action: none; }
.sheet__grab::before { content: ""; width: 36px; height: 4px; border-radius: 20px; background: var(--grabber); }
.sheet__body { overflow-y: auto; scrollbar-width: none; min-height: 0; }
.sheet__body::-webkit-scrollbar { display: none; }
/* Крестик шторки: серый круг 24 (shape #B8B9C0) с белым крестом */
.x-btn { width: 24px; height: 24px; flex: none; display: grid; place-items: center; }
.x-btn svg { display: block; }
/* Расширенная зона касания */
.x-btn { position: relative; }
.x-btn::after { content: ""; position: absolute; inset: -10px; }

/* Тост */
.toast { position: absolute; z-index: 90; left: 50%; bottom: calc(24px + 34px + var(--safe-b)); transform: translate(-50%, 16px); opacity: 0; pointer-events: none;
  background: rgb(28 28 30 / .9); color: var(--t-inv); border-radius: 16px; padding: 12px 16px; font-size: 13px; line-height: 18px; font-weight: 500;
  white-space: nowrap; transition: transform 300ms var(--ease-out), opacity 180ms; }
.toast.is-open { transform: translate(-50%, 0); opacity: 1; }

/* Переключатель варианта A5 (незаметный, только на десктопе рядом с телефоном) */
.vswitch { position: fixed; top: 16px; right: 16px; display: flex; gap: 4px; padding: 4px; border-radius: 12px; background: #fff; box-shadow: 0 2px 8px rgb(0 0 0 / .08); font-size: 13px; line-height: 18px; }
.vswitch button { padding: 6px 10px; border-radius: 8px; color: var(--t2); }
.vswitch button.is-on { background: var(--bg2); color: var(--t1); font-weight: 500; }
@media (max-width: 500px) { .vswitch { display: none; } }

@media (prefers-reduced-motion: reduce) { .screens.is-animating .screen, .sheet, .scrim, .toast { transition-duration: 1ms !important; } }

</style>

<script>
/* drugometr.js — экран «Другометр» (A2 → A3 → A4, ветка A2.3 → A2.4) и панель выбора.
   Состояние: раскрытый друг (один), выбранные продукты по друзьям. Мост к шторкам: UI.openSend(), UI.addContact(c). */
(() => {
  const D = window.DATA;
  const M = UI.money;
  const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;');
  const nl = s => esc(s).replace(/\n/g, '<br>');
  const plural = (n, a, b, c) => { const m10 = n % 10, m100 = n % 100; return m10 === 1 && m100 !== 11 ? a : (m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20) ? b : c); };
  UI.plural = plural;
  UI.prodWord = n => n + ' ' + plural(n, 'продукт', 'продукта', 'продуктов');

  const S = UI.state = { friends: D.friends.map(f => ({ ...f })), open: null, sel: {} };
  const maxOf = f => f.products.reduce((s, p) => s + D.products[p].you, 0);
  const selOf = f => (S.sel[f.id] || []);
  const sumOf = f => selOf(f).reduce((s, p) => s + D.products[p].you, 0);
  UI.sumOf = sumOf; UI.selOf = selOf;
  UI.chosen = () => S.friends.filter(f => selOf(f).length);

  /* ---------- Спидометр: геометрия из эллипсов Figma (центр 150,150; радиус средней линии 139; толщина 22) ---------- */
  const pt = a => { const r = a * Math.PI / 180; return [(150 + 139 * Math.cos(r)).toFixed(2), (150 + 139 * Math.sin(r)).toFixed(2)]; };
  const arc = (a0, a1) => { const [x0, y0] = pt(a0), [x1, y1] = pt(a1); return `M${x0} ${y0}A139 139 0 0 1 ${x1} ${y1}`; };
  const [kx, ky] = pt(198.6);
  const gauge = `<svg class="dm-gauge__svg" viewBox="0 0 300 140" aria-hidden="true">
      <defs><filter id="knobsh" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity=".12"/></filter></defs>
      <path d="${arc(190.1, 351.3)}" fill="none" stroke="#F2F3F5" stroke-width="22" stroke-linecap="round"/>
      <path d="${arc(188.7, 197.7)}" fill="none" stroke="#0CC44D" stroke-width="22" stroke-linecap="round"/>
      <circle cx="${kx}" cy="${ky}" r="10.5" fill="#fff" stroke="#0CC44D" stroke-width="3" filter="url(#knobsh)"/>
    </svg>`;

  const head = `<header class="dm-nav">${UI.sb()}<div class="dm-nav__bar">
      <button class="dm-nav__back" data-back aria-label="Назад">${UI.ic.back}</button>
      <div class="dm-nav__title">Другометр</div></div></header>`;

  const hero = `<section class="dm-hero">
      <div class="dm-gauge">${gauge}
        <div class="dm-gauge__sum">${M(D.hero.earned)}</div>
        <div class="dm-gauge__cap">заработали из ${M(D.hero.potential)}</div>
      </div>
      <div class="dm-tiles">
        <div class="dm-tile"><div class="dm-tile__cap">В пути</div><div class="dm-tile__sum">${M(D.hero.inWay)}</div></div>
        <div class="dm-tile"><div class="dm-tile__cap">Можно ещё</div><div class="dm-tile__sum">${M(D.hero.more)}</div></div>
      </div>
    </section>`;

  const product = (f, pid) => {
    const p = D.products[pid], on = selOf(f).includes(pid);
    return `<button class="dm-prod${on ? ' is-on' : ''} dm-prod--${pid}" data-pick="${f.id}:${pid}" aria-pressed="${on}">
        <span class="dm-prod__pic"><img src="${p.img}" alt="" width="99" height="81"></span>
        <span class="dm-prod__you">Вам ${M(p.you)}</span>
        <span class="dm-prod__name">${nl(p.title)}</span>
        <span class="dm-prod__check">${on ? UI.ic.check : UI.ic.checkEmpty}</span>
      </button>`;
  };
  const badge = f => {
    const n = selOf(f).length;
    return n && S.open !== f.id
      ? `<span class="dm-badge dm-badge--dark">${UI.prodWord(n)} · ${M(sumOf(f))}</span>`
      : `<span class="dm-badge">до ${M(maxOf(f))}</span>`;
  };
  const friend = f => {
    const open = S.open === f.id;

  const DUR = 280, EASE = 'cubic-bezier(.2,.8,.2,1)';
  const still = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
  let shown = null;   /* какой друг раскрыт в DOM сейчас */
  function render(anim) {
    const prev = shown;
    const oldCard = prev ? friendsEl.querySelector(`[data-friend="${prev}"]`) : null;
    const ribbon = oldCard && oldCard.querySelector('.dm-ribbon'), rx = ribbon ? ribbon.scrollLeft : 0;
    let ghost = null, ghostH = 0;
    if (anim && oldCard && prev !== S.open && !still()) { ghostH = oldCard.offsetHeight; ghost = [...oldCard.querySelectorAll('.dm-friend__hint, .dm-ribbon')]; }
    friendsEl.innerHTML = list();
    shown = S.open;
    const nr = S.open && friendsEl.querySelector(`[data-friend="${S.open}"] .dm-ribbon`); if (nr && S.open === prev) nr.scrollLeft = rx;
    const html = panel();
    panelEl.innerHTML = html; panelEl.hidden = !html;
    root.classList.toggle('has-panel', !!html);
    if (!anim || still()) return;
    /* Сворачивание: старое содержимое уезжает вправо, высота карточки уменьшается до 80 */
    if (ghost) {
      const card = friendsEl.querySelector(`[data-friend="${prev}"]`);
      if (card) {
        ghost.forEach(n => card.appendChild(n)); ghost[1] && (ghost[1].scrollLeft = rx);
        card.style.overflow = 'hidden';
        card.animate([{ height: ghostH + 'px' }, { height: '80px' }], { duration: DUR, easing: EASE })
          .onfinish = () => { ghost.forEach(n => n.remove()); card.style.overflow = ''; };
        ghost.forEach(n => n.animate([{ transform: 'none', opacity: 1 }, { transform: 'translateX(120px)', opacity: 0 }], { duration: DUR, easing: EASE, fill: 'forwards' }));
      }
    }
    /* Раскрытие: высота растёт от 80, подсказка проявляется, лента выезжает справа */
    if (S.open && S.open !== prev) {
      const card = friendsEl.querySelector(`[data-friend="${S.open}"]`), h = card.offsetHeight;
      card.style.overflow = 'hidden';
      card.animate([{ height: '80px' }, { height: h + 'px' }], { duration: DUR, easing: EASE }).onfinish = () => { card.style.overflow = ''; };
      const hint = card.querySelector('.dm-friend__hint'), rib = card.querySelector('.dm-ribbon');
      hint && hint.animate([{ opacity: 0 }, { opacity: 1 }], { duration: DUR, easing: EASE });
      rib && rib.animate([{ transform: 'translateX(120px)', opacity: 0 }, { transform: 'none', opacity: 1 }], { duration: DUR, easing: EASE });
    }
  }
  UI.renderDrugometr = render;
  /* Раскрытая карточка не должна прятаться под панелью выбора: докручиваем список, чтобы лента была видна над панелью */
  function reveal(id) {
    const card = friendsEl.querySelector(`[data-friend="${id}"]`), sc = root.querySelector('.dm-scroll'); if (!card) return;
    const r = card.getBoundingClientRect(), sr = sc.getBoundingClientRect();
    const bottom = sr.bottom - (panelEl.hidden ? 0 : panelEl.offsetHeight) - 12;
    if (r.bottom > bottom) sc.scrollBy({ top: Math.min(r.bottom - bottom, r.top - sr.top - 8), behavior: 'smooth' });
  }

  root.addEventListener('click', e => {
    const t = e.target.closest('[data-toggle]');
    if (t) { const id = t.dataset.toggle; const was = S.open === id; S.open = was ? null : id; render(true);
      if (!was) setTimeout(() => reveal(id), still() ? 0 : DUR + 20);   /* докрутка — после того как карточка выросла */
      return; }
    const p = e.target.closest('[data-pick]');
    if (p) { const [fid, pid] = p.dataset.pick.split(':'); const cur = S.sel[fid] || [];
      const f = S.friends.find(x => x.id === fid);
      S.sel[fid] = cur.includes(pid) ? cur.filter(x => x !== pid) : f.products.filter(x => x === pid || cur.includes(x));
      render(); reveal(fid); return; }
    if (e.target.closest('[data-send]')) UI.openSend();
  });

  /* Контакт из поиска встаёт первым (A2.3): «до 24 000 ₽», вся лента продуктов */
  UI.addContact = c => {
    const id = 'c' + D.contacts.indexOf(c);
    const was = S.friends.find(f => f.id === id);
    S.friends = S.friends.filter(f => f.id !== id);   /* повторно выбранный контакт тоже встаёт первым */
    S.friends.unshift(was || { id, name: c.short, dat: c.dat, ini: c.ini, products: Object.keys(D.products) });
    S.open = null; render();
    root.querySelector('.dm-scroll').scrollTo({ top: 0, behavior: 'smooth' }); /* как на A2.3: список с начала, контакт первым */
  };
})();

</script>

    fill('share', `${grab}
      <div class="sheet__head sh-nav sh-nav--share"><div class="sh-nav__l"><div class="sh-title-share">Отправить ссылку ${esc(f.dat)}</div>

      <div class="sh-channels no-swipe">${CH.map(c => `<button class="sh-ch" data-ch="${c.id}" data-name="${c.t}">

          <span class="sh-ch__t">${c.t}</span></button>`).join('')}</div>`);
    App.openSheet('share');
  };

  /* ---------- A2.2 ---------- */
  const contactsHtml = q => {
    const nz = x => x.toLowerCase().replace(/ё/g, 'е'); const qq = nz(q.trim());
    const list = D.contacts.filter(c => !qq || nz(c.name).includes(qq) || D.phone.replace(/\D/g, '').includes(qq.replace(/\D/g, '') || '@'));
    if (!list.length) return `<div class="sh-empty"><div class="sh-empty__t">Ничего не&nbsp;найдено</div>Введите другое имя или&nbsp;номер</div>`;
    let last = '', out = '';
    list.forEach(c => {
      if (c.letter !== last) { out += `<div class="sh-letter">${c.letter}</div>`; last = c.letter; }
      out += `<button class="sh-contact" data-contact="${D.contacts.indexOf(c)}"><span class="sh-sq">${c.ini}</span>
        <span class="sh-contact__txt"><span class="sh-contact__name">${esc(c.name)}</span><span class="sh-contact__ph">${D.phone}</span></span></button>`;
    });
    return out;
  };

  const sheetSearch = document.querySelector('.sheet[data-sheet-id="search"]');
  const q = sheetSearch.querySelector('#sh-q'), listEl = sheetSearch.querySelector('#sh-list');
  q.addEventListener('input', () => { listEl.innerHTML = contactsHtml(q.value); });
  sheetSearch.addEventListener('sheet:open', () => { q.value = ''; listEl.innerHTML = contactsHtml(''); listEl.scrollTop = 0; if (!touch) setTimeout(() => q.focus({ preventScroll: true }), 320); });
  sheetSearch.addEventListener('sheet:close', () => q.blur());
  /* На телефоне фокус ставим прямо в обработчике тапа по лупе — иначе iOS не откроет клавиатуру */
  document.addEventListener('click', e => {
    if (!touch || !e.target.closest('[data-sheet="search"]')) return;
    e.stopPropagation(); App.openSheet('search'); q.focus({ preventScroll: true });
  }, true);

  /* ---------- Клики внутри шторок ---------- */
  document.addEventListener('click', e => {
    const s = e.target.closest('[data-share]');
    if (s) { UI.openShare(s.dataset.share); return; }
    const c = e.target.closest('[data-ch]');
    if (c) { App.closeSheet(); setTimeout(() => App.toast(c.dataset.ch === 'copy' ? 'Ссылка скопирована' : 'Открываем ' + c.dataset.name), 250);
      if (c.dataset.ch === 'copy' && navigator.clipboard) navigator.clipboard.writeText('https://alfa.me/ref').catch(() => {});
      return; }
    const k = e.target.closest('[data-contact]');
    if (k) { App.closeSheet(); UI.addContact(D.contacts[+k.dataset.contact]); }
  });

  /* ---------- Переключатель варианта A5 ---------- */
  const sw = document.getElementById('vswitch');
  if (sw) {
    const paint = () => sw.querySelectorAll('button').forEach(b => b.classList.toggle('is-on', +b.dataset.v === variant));
    sw.addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; variant = +b.dataset.v; paint();
      const u = new URL(location.href); if (variant === 2) u.searchParams.set('v', '2'); else u.searchParams.delete('v'); history.replaceState(null, '', u);
      if (App.sheet === 'send') renderSend(); });
    paint();
  }
})();

</script>
<script>
/* app.js — роутер прототипа: стек экранов (push/back), шторки (крестик, свайп, тап по фону), тост.
   Подключается последним, после screens/*.js. */
(() => {
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const screensEl = $('#screens');
  const screen = id => $(`.screen[data-screen="${id}"]`);
  let stack = ['entry'];
  let busy = false;

  function setActive(id) {
    $$('.screen.is-active').forEach(s => s.classList.remove('is-active'));
    screen(id).classList.add('is-active');
    history.replaceState(history.state, '', location.pathname + location.search + '#' + id);
  }
  function animate(from, to, kind) {
    busy = true;
    const [o, i] = kind === 'push' ? ['push-out', 'push-in'] : ['pop-out', 'pop-in'];
    from.classList.add(o); to.classList.add(i);
    screensEl.classList.add('is-animating'); screensEl.style.pointerEvents = 'none';
    void to.offsetWidth;
    requestAnimationFrame(() => { from.classList.add('go'); to.classList.add('go'); });
    setTimeout(() => {
      screensEl.classList.remove('is-animating'); screensEl.style.pointerEvents = '';
      [from, to].forEach(s => s.classList.remove('push-out', 'push-in', 'pop-out', 'pop-in', 'go'));
      setActive(to.dataset.screen); busy = false;
    }, 380);
  }
  /* go / back идут через историю браузера: системный «Назад» (свайп от края, кнопка Android) ведёт по прототипу */
  function go(id) {
    if (busy || !screen(id) || stack[stack.length - 1] === id) return;
    if (openId) closeSheetNow(true);
    const from = screen(stack[stack.length - 1]);
    stack.push(id);
    history.pushState({ screen: id }, '', location.pathname + location.search + '#' + id);
    to_top(screen(id));
    animate(from, screen(id), 'push');
  }
  function back() { if (!busy && stack.length > 1) history.back(); }
  function popScreen() {
    if (stack.length < 2) return;
    if (openId) closeSheetNow(true);
    const from = screen(stack.pop());
    if (busy) { $$('.screen').forEach(x => x.classList.remove('push-out', 'push-in', 'pop-out', 'pop-in', 'go')); setActive(stack[stack.length - 1]); return; }
    animate(from, screen(stack[stack.length - 1]), 'pop');
  }
  const to_top = s => s.querySelectorAll('.scroll').forEach(x => x.scrollTo(0, 0));

  /* ---------- Шторки ---------- */
  const scrim = $('#scrim');
  let openId = null;
  function openSheet(id) {
    const s = $(`.sheet[data-sheet-id="${id}"]`); if (!s) return;
    if (openId) { closeSheetNow(true); history.replaceState({ sheet: id }, ''); }   /* шторка сменяет шторку (A5 → A6) */
    else history.pushState({ sheet: id }, '');
    openId = id; s.style.transform = '';
    scrim.className = 'scrim is-open' + (s.dataset.scrim ? ' scrim--' + s.dataset.scrim : '');
    s.classList.add('is-open');
    s.dispatchEvent(new CustomEvent('sheet:open'));
  }
  /* Закрыть из интерфейса (крестик, фон, свайп, Esc) = шаг назад в истории; popstate закроет шторку */
  function closeSheet(instant) {
    if (!openId) return;
    if (history.state && history.state.sheet) {
      if (instant) { closeSheetNow(true); history.replaceState(null, ''); } else history.back();
      return;
    }
    closeSheetNow(instant);
  }
  function closeSheetNow(instant) {
    if (!openId) return;
    const s = $(`.sheet[data-sheet-id="${openId}"]`); openId = null;
    if (instant) { s.style.transition = 'none'; scrim.style.transition = 'none'; }
    scrim.classList.remove('is-open'); s.classList.remove('is-open'); s.style.transform = '';
    s.dispatchEvent(new CustomEvent('sheet:close'));
    if (instant) { void s.offsetWidth; s.style.transition = ''; scrim.style.transition = ''; }
  }
  scrim.addEventListener('click', () => closeSheet());
  /* Свайп вниз: за грабер и шапку; на телефоне — ещё и за тело шторки, когда оно прокручено к началу.
     Мышь — pointer-события, палец — touch-события с preventDefault (иначе браузер шлёт pointercancel и забирает жест) */
  $$('.sheet').forEach(s => {
    let y0 = null, dy = 0, t0 = 0, armed = false;
    const canStart = (t, touch) => {
      if (t.closest('button, a, input, [data-close], .no-swipe')) return false;
      if (t.closest('.sheet__grab, .sheet__head')) return true;
      const body = t.closest('.sheet__body');
      return !!(touch && body && body.scrollTop <= 0);
    };
    const begin = y => { y0 = y; dy = 0; t0 = Date.now(); armed = false; };
    const move = (y, e) => {
      if (y0 === null) return;
      const d = y - y0;
      if (!armed) {
        if (d < -4) { y0 = null; return; }
        if (d <= 4) return;
        armed = true; s.style.transition = 'none';
      }
      if (e && e.cancelable) e.preventDefault();
      dy = Math.max(0, d); s.style.transform = 'translateY(' + dy + 'px)';
    };
    const end = () => {
      if (y0 === null) return; y0 = null; s.style.transition = '';
      if (!armed) return;
      const fast = dy > 30 && Date.now() - t0 < 250;
      if (dy > 90 || fast) closeSheet(); else s.style.transform = '';
    };
    s.addEventListener('pointerdown', e => { if (e.pointerType === 'mouse' && canStart(e.target, false)) begin(e.clientY); });
    window.addEventListener('pointermove', e => { if (e.pointerType === 'mouse') move(e.clientY); });
    window.addEventListener('pointerup', e => { if (e.pointerType === 'mouse') end(); });
    s.addEventListener('touchstart', e => { if (canStart(e.target, true)) begin(e.touches[0].clientY); }, { passive: true });
    s.addEventListener('touchmove', e => move(e.touches[0].clientY, e), { passive: false });
    s.addEventListener('touchend', end); s.addEventListener('touchcancel', end);
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && openId) closeSheet(); });

  /* Системный «Назад»: сначала закрывает шторку, потом возвращает экран */
  window.addEventListener('popstate', () => { if (openId) closeSheetNow(); else popScreen(); });

  /* ---------- Тост ---------- */
  const toastEl = $('#toast'); let tt;
  function toast(text) {
    /* 24 px над нижней панелью (правило проекта), иначе 24 px над низом экрана */
    const panel = $('.screen.is-active .dm-panel:not([hidden])');
    toastEl.style.bottom = panel ? panel.offsetHeight + 24 + 'px' : '';
    toastEl.textContent = text; toastEl.classList.add('is-open'); clearTimeout(tt); tt = setTimeout(() => toastEl.classList.remove('is-open'), 2200); }

  /* ---------- Клики по data-атрибутам ---------- */
  document.addEventListener('click', e => {
    const el = e.target.closest('[data-go],[data-back],[data-sheet],[data-close],[data-toast]');
    if (!el) return;
    const d = el.dataset;
    if ('close' in d) closeSheet();
    if ('sheet' in d) openSheet(d.sheet);
    if ('back' in d) back();
    if ('go' in d) go(d.go);
    if ('toast' in d) setTimeout(() => toast(d.toast), 'close' in d ? 250 : 0);
  });

  window.App = { go, back, openSheet, closeSheet, toast, get sheet() { return openId; } };

  /* Старт: #экран в адресе */
  const start = location.hash.slice(1);
  history.replaceState({ screen: 'entry' }, '', location.pathname + location.search + '#entry');
  if (start && start !== 'entry' && screen(start)) { stack = ['entry', start]; history.pushState({ screen: start }, '', location.pathname + location.search + '#' + start); }
  setActive(stack[stack.length - 1]);
})();

</script>
</body>
